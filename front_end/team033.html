<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能聊天機器人</title>
    <link rel="stylesheet" href="team033.css">
</head>
<body>
    <div class="chat-container">
        <!-- 標題 -->
        <header>
            <h1>智能聊天機器人</h1>
        </header>
        <!-- 對話框 -->
        <div class="chat-window" id="chat-window">
            <!-- 動態插入訊息 -->
        </div>
        <!-- 輸入區 -->
        <div class="input-area">
            <!-- 附件鍵 -->
            <label for="upload-image" id="upload-image-label">📎</label>
            <input type="file" id="upload-image" accept=".jpg, .jpeg, .png" />
            <!-- 圓角輸入框 -->
            <input type="text" id="message-input" placeholder="輸入訊息...">
            <!-- 傳送按鈕 -->
            <button id="send-button">⬆</button>
        </div>        
        
    </div>
    <script src="team033.js"></script>
</body>
</html>
