{% extends "base2.html" %}
{% block title %}
  設定新密碼 · My Driving God
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}" />
{% endblock %}

{% block content %}
  <div class="login-container">
    <div class="login-promo">
        <div class="promo-content">
            <h1>設定您的新密碼</h1>
            <p>請設定一組新的、高強度的密碼來保護您的帳戶安全。</p>
            <ul class="feature-list">
              <li><i class="fa-solid fa-key"></i> 強密碼保護</li>
              <li><i class="fa-solid fa-shield-halved"></i> 帳戶安全更新</li>
              <li><i class="fa-solid fa-circle-check"></i> 快速完成重設</li>
            </ul>
        </div>
    </div>
    <div class="login-form-wrapper">
        <form id="resetPasswordForm" class="login-form">
          <h2>設定新密碼</h2>
          <p style="text-align: center; margin-bottom: 2rem; color: #6b7280;">請輸入您的新密碼，並再次確認。</p>

          <div id="messageDiv" style="display: none; margin-bottom: 1.5rem;"></div>

          <div class="form-group">
            <label for="password">新密碼</label>
            <input type="password" id="password" name="password" placeholder="請輸入至少8位數的新密碼" required minlength="8" />
          </div>

          <div class="form-group">
            <label for="password_confirm">確認新密碼</label>
            <input type="password" id="password_confirm" name="password_confirm" placeholder="請再次輸入新密碼" required minlength="8" />
          </div>

          <div class="form-actions" style="margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">儲存新密碼</button>
          </div>
          
        </form>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script src="{{ url_for('static', filename='js/pages/reset_password.js') }}"></script>
{% endblock %}
