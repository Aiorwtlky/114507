{% extends 'base2.html' %}
{% block html_class %}
  scroll-snap
{% endblock %}
{% block title %}
  首頁 · My Driving God
{% endblock %}
{% block content %}
  <!-- ===== Hero ===== -->
  <section class="hero" id="hero">
    <div class="hero-layout">
      <div class="hero-content">
        <h1 class="mega-title">智慧駕駛<span class="gradient-text">新紀元</span></h1>
        <p class="subtitle">立即註冊或登入，體驗科技守護安全</p>

      </div>
      <div class="hero-visual"></div>
    </div>
  </section>

  <!-- ===== Features ===== -->
  <section class="features" id="features">
    <article class="card teal">
      <i class="fa-solid fa-file-lines"></i>
      <h3>AI建議</h3>
      <p></p>
    </article>

    <article class="card pink">
      <i class="fa-solid fa-bed"></i>
      <h3>疲勞預警</h3>
      <p></p>
    </article>

    <article class="card amber">
      <i class="fa-solid fa-shield-halved"></i>
      <h3>事件雲回放</h3>
      <p></p>
    </article>

    <article class="card lime">
      <i class="fa-solid fa-cloud-arrow-down"></i>
      <h3>事故影片下載</h3>
      <p></p>
    </article>

    <article class="card blue">
      <i class="fa-solid fa-road"></i>
      <h3>車道偏移</h3>
      <p></p>
    </article>

    <article class="card red">
      <i class="fa-solid fa-comments"></i>
      <h3>智慧客服</h3>
      <p></p>
    </article>
  </section>
{% endblock %}
