{% extends 'base.html' %}
{% block title %}群組設定 · My Driving God{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/group_settings.css') }}" />
{% endblock %}

{% block content %}
<div class="settings-container">
    <div class="d-card settings-card">
        <div class="d-card-header">
            <h3><i class="fas fa-cog"></i> 群組設定</h3>
        </div>
        <div class="d-card-body">
            <form class="settings-form" id="settings-form">
                <div class="form-row">
                    <label for="group-name-input">群組名稱</label>
                    <input type="text" id="group-name-input" name="group-name" placeholder="載入中..." required />
                </div>

                <div class="form-row">
                    <label for="group-description-input">群組描述</label>
                    <textarea id="group-description-input" name="group-description" rows="3" placeholder="載入中..."></textarea>
                </div>

                <div class="form-row">
                    <label>管理員</label>
                    <div class="leaders-management" id="leaders-management-list">
                        <p class="info-text">管理員功能開發中...</p>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-danger" id="delete-group-btn">刪除此群組</button>
                    <button type="submit" class="btn btn-primary">儲存變更</button>
                </div>
            </form>
        </div>
    </div>
    <div class="back-button-area">
        <a href="{{ url_for('group_leader_view') }}" class="btn btn-outline" id="back-to-leader-view"><i class="fa-solid fa-arrow-left"></i> 返回群組管理</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
  <script src="{{ url_for('static', filename='js/pages/group_settings.js') }}"></script>
{% endblock %}
