{% extends 'base.html' %}
{% block title %}
  所有過往行程 · My Driving God
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  
  <style>
    /* --- 基本 & 整體佈局 --- */
    body { background-color: #f4f7fa; font-family: 'Inter', 'Noto Sans TC', sans-serif; }
    .all-reports-section { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .mega-title { font-size: 2.5rem; font-weight: 800; text-align: center; margin-bottom: 2rem; }
    .gradient-text { background: linear-gradient(45deg, #1a2a5f, #2c46a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-fill-color: transparent; }

    /* --- 篩選與搜尋控制區 --- */
    .controls-container { background-color: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); margin-bottom: 2.5rem; display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .filter-group label { font-weight: 500; color: #555; font-size: 0.9rem; }
    .filter-group input[type="date"], .filter-group input[type="search"] { padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; min-width: 180px; }
    .filter-group.search-group { flex-grow: 1; }
    .btn-filter { padding: 0.75rem 1.5rem; background-color: #1a2a5f; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; gap: 0.5rem; transition: background-color 0.2s; }
    .btn-filter:hover { background-color: #2c46a0; }

    /* --- 行程卡片網格 --- */
    .reports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .report-card { background-color: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06); padding: 1.5rem; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
    .report-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); }
    
    /* --- [重構] 卡片標頭 --- */
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start; /* 頂部對齊 */
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.75rem;
    }
    .report-meta { color: #666; font-size: 0.9rem; }
    .report-meta p { margin: 0 0 0.25rem 0; }
    .report-id span { font-weight: 600; color: #333; }

    /* --- [新增] 行程總分樣式 --- */
    .report-score {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.5rem;
        font-weight: 700;
        flex-shrink: 0; /* 防止被壓縮 */
    }
    /* 分數顏色 */
    .score-high { background-color: #16a34a; } /* 優良 - 綠色 */
    .score-medium { background-color: #f59e0b; } /* 普通 - 橘色 */
    .score-low { background-color: #dc2626; } /* 待改進 - 紅色 */


    .report-body { flex-grow: 1; }
    
    /* --- [新增] 名稱 + 編輯圖示 --- */
    .report-name-wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0.5rem 0 1rem 0;
    }
    .report-name { font-size: 1.5rem; font-weight: 600; color: #1a2a5f; margin: 0; }
    .edit-icon { color: #aaa; font-size: 1.1rem; cursor: pointer; transition: color 0.2s; }
    .edit-icon:hover { color: #1a2a5f; }
    
    .report-name.placeholder { color: #888; font-style: italic; font-weight: 500; }

    /* --- 按鈕樣式 (與前版相同) --- */
    .btn { display: block; width: 100%; text-align: center; padding: 0.75rem; border-radius: 8px; text-decoration: none; font-weight: 500; transition: background-color 0.2s, color 0.2s, border-color 0.2s; margin-top: 1rem; border: 1px solid transparent; cursor: pointer; }
    .btn-details { background-color: #1a2a5f; color: white; }
    .btn-details:hover { background-color: #2c46a0; }

    /* --- 分頁 --- */
    .pagination-container { margin-top: 3rem; display: flex; justify-content: center; }
    .pagination { display: flex; list-style: none; padding: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .page-item .page-link { padding: 0.75rem 1rem; display: block; background-color: #fff; color: #1a2a5f; text-decoration: none; border-left: 1px solid #dee2e6; }
    .page-item:first-child .page-link { border-left: none; }
    .page-item .page-link:hover { background-color: #f4f7f9; }
    .page-item.active .page-link { background-color: #1a2a5f; color: white; font-weight: bold; }
    .page-item.disabled .page-link { color: #aaa; background-color: #f8f9fa; pointer-events: none; }
  </style>
{% endblock %}

{% block content %}
  <section class="all-reports-section">
    <h1 class="mega-title gradient-text">所有過往行程</h1>
    <div class="controls-container">
      </div>
    <div class="reports-grid" id="reports-grid-container">
      <p>載入中...</p>
    </div>
    </section>
{% endblock %}
{% block extra_js %}
  <script src="{{ url_for('static', filename='js/pages/all_reports.js') }}"></script>
{% endblock %}
