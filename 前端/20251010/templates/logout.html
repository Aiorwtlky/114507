<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已登出 - My Driving God</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    
    <style>
        /* 引用您 base_app.css 中的核心變數，確保風格一致 */
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --light-bg: #f8f9fa;
            --white-bg: #ffffff;
            --text-dark: #212529;
            --text-muted: #6c757d;
            --success-color: #28a745;
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        /* 登出卡片 */
        .logout-card {
            background: var(--white-bg);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        /* 品牌 Logo */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .brand-logo {
            height: 36px;
        }
        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* 成功圖示 */
        .icon-container {
            font-size: 4rem;
            color: var(--success-color);
            margin-bottom: 1.5rem;
        }

        /* 訊息文字 */
        h1 {
            font-size: 1.75rem;
            margin: 0 0 0.5rem 0;
        }
        p {
            color: var(--text-muted);
            margin: 0 0 2.5rem 0;
            line-height: 1.6;
        }

        /* 操作按鈕 */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            border: 1px solid transparent;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white-bg);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
        }
        .btn-secondary:hover {
            background-color: rgba(0, 123, 255, 0.1);
        }

        /* 淡入動畫 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="logout-card">
        <div class="brand-header">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="My Driving God Logo" class="brand-logo">
            <span class="brand-text">MDG Pro</span>
        </div>

        <div class="icon-container">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1>您已成功登出</h1>
        <p>感謝您使用 MDG Pro 智慧駕駛管理系統。您的所有連線均已安全結束。</p>

        <div class="action-buttons">
            <a href="{{ url_for('login') }}" class="btn btn-primary">重新登入</a>
            <a href="{{ url_for('home') }}" class="btn btn-secondary">返回首頁</a>
        </div>
    </div>

</body>
</html>
