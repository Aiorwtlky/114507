{% extends 'base.html' %}

{% block title %}公告詳情 · My Driving God{% endblock %}

{% block page_heading %}群組公告{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/announcements.css') }}" />
{% endblock %}

{% block content %}
<div class="announcement-detail-container">
    
    <div class="d-card announcement-header-card">
        <div class="announcement-header-content">
            <div class="announcement-meta-info">
                <h1 class="announcement-subject" id="announcement-subject">載入中...</h1>
                <div class="announcement-info-row">
                    <div class="info-item">
                        <i class="fa-solid fa-user"></i>
                        <span class="info-label">發佈人：</span>
                        <span class="info-value" id="announcement-publisher">--</span>
                    </div>
                    <div class="info-item">
                        <i class="fa-solid fa-calendar"></i>
                        <span class="info-label">發佈日期：</span>
                        <span class="info-value" id="announcement-date">--</span>
                    </div>
                    <div class="info-item">
                        <i class="fa-solid fa-users"></i>
                        <span class="info-label">發佈至：</span>
                        <span class="info-value" id="announcement-group">--</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <a href="{{ url_for('group_leader_view') }}" class="btn btn-outline">
                    <i class="fa-solid fa-arrow-left"></i>
                    返回群組
                </a>
            </div>
        </div>
    </div>

    <div class="d-card announcement-content-card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fa-solid fa-file-lines"></i>
                公告內容
            </h3>
        </div>
        <div class="announcement-body" id="announcement-body">
            <p>載入中...</p>
        </div>
    </div>

    <div class="action-buttons">
        <a href="{{ url_for('group_leader_view') }}" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i>
            返回群組
        </a>
        <button class="btn btn-primary" onclick="window.print()">
            <i class="fa-solid fa-print"></i>
            列印公告
        </button>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/pages/announcements.js') }}"></script>
{% endblock %}
