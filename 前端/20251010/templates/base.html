<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MDG Pro - 智慧駕駛管理系統">
    <title>{% block title %}MDG Pro{% endblock %} - My Driving God</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_app.css') }}">
    
    {% block extra_css %}{% endblock %}

    <style>
      /* --- 浮動觸發按鈕 (FAB) --- */
      .chat-fab {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        width: 60px;
        height: 60px;
        background-color: var(--primary-color); /* 使用您的主要顏色 */
        color: white;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        cursor: pointer;
        box-shadow: var(--shadow-md); /* 使用您的陰影變數 */
        z-index: 999;
        transition: all 0.3s ease;
      }
      .chat-fab:hover {
        background-color: var(--primary-hover); /* 使用您的 hover 顏色 */
        transform: scale(1.1);
      }

      /* --- 聊天視窗容器 --- */
      .chat-widget-container {
        position: fixed;
        bottom: 7rem;
        right: 2rem;
        width: 90%;
        max-width: 380px;
        z-index: 998;
        /* 動畫初始狀態 */
        opacity: 0;
        visibility: hidden;
        transform: translateY(30px);
        transition: opacity var(--transition-speed, 0.3s), transform var(--transition-speed, 0.3s), visibility var(--transition-speed, 0.3s);
      }
      .chat-widget-container.is-open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      /* --- 聊天視窗卡片樣式 --- */
      .chat-card {
        width: 100%;
        height: 500px;
        max-height: 70vh;
        background: var(--white-bg); /* 使用您的白色背景 */
        border-radius: 8px; /* 統一圓角 */
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border-light);
      }

      .chat-header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border-light);
        background: var(--light-bg);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .chat-header h3 { font-size: 1rem; font-weight: 700; margin: 0; color: var(--text-dark); }
      .chat-header .status-indicator { display: flex; align-items: center; gap: 0.5rem; }
      .chat-header .dot { width: 10px; height: 10px; background: #28a745; border-radius: 50%; }
      .chat-header .online { font-size: 0.875rem; color: var(--text-muted); }
      .chat-header .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); padding: 0.5rem; line-height: 1; }

      .messages-area {
        flex-grow: 1;
        padding: 1rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .msg-bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 12px; line-height: 1.5; }
      .msg-bubble .author-name { font-weight: 700; font-size: 0.8rem; margin-bottom: 0.25rem; }
      .msg-bubble.is-admin { background: var(--light-bg); color: var(--text-dark); align-self: flex-start; border-top-left-radius: 4px; }
      .msg-bubble.is-user { background: var(--primary-color); color: white; align-self: flex-end; border-top-right-radius: 4px; }

      .composer-area {
        display: flex;
        padding: 1rem;
        border-top: 1px solid var(--border-light);
        background: var(--white-bg);
        flex-shrink: 0;
      }
      .composer-area textarea {
        flex-grow: 1;
        border: 1px solid var(--border-light);
        border-radius: 8px;
        padding: 0.75rem;
        resize: none;
        margin-right: 0.5rem;
        font-size: 1rem;
        font-family: inherit;
      }
      .composer-area button {
        flex-shrink: 0; width: 48px; height: 48px; border: none; background: var(--primary-color);
        color: white; border-radius: 8px; font-size: 1.25rem; cursor: pointer; transition: background-color var(--transition-speed);
      }
      .composer-area button:hover { background: var(--primary-hover); }
      .composer-area button:disabled { background-color: #ccc; cursor: not-allowed; } /* 新增禁用樣式 */

      @media (max-width: 480px) {
        .chat-widget-container { right: 1rem; bottom: 6rem; width: calc(100% - 2rem); }
        .chat-fab { right: 1rem; bottom: 1rem; }
      }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar" role="navigation" aria-label="主選單">
            <div class="sidebar-header">
                <a href="{{ url_for('home') }}" class="brand" aria-label="回到首頁">
                    <img src="{{ url_for('static', filename='images/logo.jpg') }}" 
                         alt="My Driving God Logo" 
                         class="brand-logo">
                    <span class="brand-text">MDG Pro</span>
                </a>
            </div>

            <div class="sidebar-content">
                <div class="user-profile">
                    <img src="{{ url_for('static', filename='images/user-placeholder.svg') }}" 
                         alt="使用者頭像" 
                         class="user-avatar"
                         id="sidebar-avatar"
                         loading="lazy">
                    <div class="user-details">
                        <span class="user-name" id="sidebar-username">載入中...</span>
                        <span class="user-group" id="sidebar-user-role"></span>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <a href="{{ url_for('dashboard') }}" 
                       class="nav-item {% if request.endpoint == 'dashboard' %}is-active{% endif %}"
                       {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>
                        <i class="fa-solid fa-table-columns"></i>
                        <span>數位儀表板</span>
                    </a>

                    <a href="{{ url_for('my_groups_standalone') }}" 
                       class="nav-item {% if request.endpoint == 'my_groups_standalone' %}is-active{% endif %}"
                       {% if request.endpoint == 'my_groups_standalone' %}aria-current="page"{% endif %}>
                        <i class="fa-solid fa-users"></i>
                        <span>我的群組</span>
                    </a>

                    <a href="{{ url_for('all_reports') }}" 
                       class="nav-item {% if request.endpoint == 'all_reports' %}is-active{% endif %}"
                       {% if request.endpoint == 'all_reports' %}aria-current="page"{% endif %}>
                        <i class="fa-solid fa-route"></i>
                        <span>過往行程</span>
                    </a>

                    <a href="{{ url_for('past_average_standalone') }}" 
                       class="nav-item {% if request.endpoint == 'past_average_standalone' %}is-active{% endif %}"
                       {% if request.endpoint == 'past_average_standalone' %}aria-current="page"{% endif %}>
                        <i class="fa-solid fa-chart-line"></i>
                        <span>行程數據</span>
                    </a>
                    
                    <a id="sidebar-my-videos-link" href="#" 
                    class="nav-item {% if request.endpoint == 'member_videos' %}is-active{% endif %}"
                    {% if request.endpoint == 'member_videos' %}aria-current="page"{% endif %}>
                        <i class="fa-solid fa-video"></i>
                        <span>我的行車影像</span>
                    </a>

                    <a href="{{ url_for('profile') }}" 
                       class="nav-item {% if request.endpoint in ['profile', 'edit_profile_basic'] %}is-active{% endif %}"
                       {% if request.endpoint in ['profile', 'edit_profile_basic'] %}aria-current="page"{% endif %}>
                        <i class="fa-solid fa-user-pen"></i>
                        <span>個人資料</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <a href="#" class="nav-item nav-logout-btn" id="logoutButton">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>登出</span>
                </a>
                </div>
        </aside>

        <div class="main-content-wrapper">
            <header class="app-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="hamburger-btn" 
                            id="hamburgerBtn" 
                            aria-label="開啟選單"
                            aria-expanded="false"
                            aria-controls="appSidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    
                    {% block page_title %}
                    <h1>{% block page_heading %}儀表板{% endblock %}</h1>
                    {% endblock %}
                </div>

                <div style="display: flex; align-items: center; gap: 1rem;">
                    {% block header_actions %}{% endblock %}
                </div>
            </header>

            <main class="app-main" role="main">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <div class="chat-widget-container" id="chatWidgetContainer">
        <div class="chat-card">
            <header class="chat-header">
                <div>
                  <h3>MDG智慧交通系統</h3>
                  <div class="status-indicator">
                    <span class="dot"></span>
                    <span class="online">線上客服</span>
                  </div>
                </div>
                <button class="close-btn" id="chatCloseBtn" title="關閉">&times;</button>
            </header>
            <main class="messages-area" id="messagesArea">
                </main>
            <footer class="composer-area">
                <textarea id="messageInput" placeholder="請在此輸入您的問題..." rows="1"></textarea>
                <button id="sendBtn" title="傳送"><i class="fa-solid fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <button class="chat-fab" id="chatFab" title="開啟線上客服">
        <i class="fa-solid fa-headset"></i>
    </button>
    
    <script src="{{ url_for('static', filename='js/main_app.js') }}" defer></script>
    
    {% block extra_js %}{% endblock %}

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const chatFab = document.getElementById('chatFab');
        const chatWidget = document.getElementById('chatWidgetContainer');
        const chatCloseBtn = document.getElementById('chatCloseBtn');
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const API_BASE_URL = 'http://127.0.0.1:8000';
        const API_URL = `${API_BASE_URL}/api/chatbot/`;

        // 儲存對話歷史
        let chatHistory = [
            { role: 'model', content: '您好！我是吾仙，MDG的AI客服，請問有什麼可以為您服務的嗎？' }
        ];

        // 函式：執行帶有認證的 fetch 請求
        async function fetchWithAuth(endpoint, options = {}) {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                alert('您尚未登入或登入已逾時，無法使用此功能。');
                window.location.href = '/login';
                throw new Error('Not Authenticated');
            }
            const headers = options.headers || new Headers();
            headers.append('Authorization', `Bearer ${token}`);
            if (!(options.body instanceof FormData)) {
                headers.append('Content-Type', 'application/json');
            }
            const response = await fetch(endpoint, { ...options, headers });
            if (response.status === 401) {
                alert('您的登入已過期，請重新登入。');
                localStorage.clear();
                window.location.href = '/login';
                throw new Error('Token Expired');
            }
            return response;
        }

        // 函式：將訊息泡泡加到畫面
        function appendMessage(text, type, author = '吾仙') {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('msg-bubble', type);

            if (type === 'is-admin') {
                const authorDiv = document.createElement('div');
                authorDiv.classList.add('author-name');
                authorDiv.textContent = author;
                messageDiv.appendChild(authorDiv);
            }

            const textDiv = document.createElement('div');
            textDiv.classList.add('text');
            textDiv.textContent = text;

            messageDiv.appendChild(textDiv);
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
        
        // 函式：初始化聊天室，顯示歡迎訊息
        function initializeChat() {
            messagesArea.innerHTML = ''; // 清空
            appendMessage(chatHistory[0].content, 'is-admin');
        }

        // 核心函式：傳送訊息給後端 AI API
        async function sendMessage() {
            const userText = messageInput.value.trim();
            if (userText === '') return;

            appendMessage(userText, 'is-user');
            messageInput.value = '';
            messageInput.style.height = 'auto'; // 重設高度
            chatHistory.push({ role: 'user', content: userText });

            try {
                sendBtn.disabled = true; 
                
                const response = await fetchWithAuth(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ messages: chatHistory })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ reply: '伺服器發生未知錯誤。' }));
                    throw new Error(errorData.reply || `API 錯誤: ${response.status}`);
                }

                const data = await response.json();
                const aiReply = data.reply;

                appendMessage(aiReply, 'is-admin');
                chatHistory.push({ role: 'model', content: aiReply });

            } catch (error) {
                console.error("Chat API Error:", error);
                // 如果 API 呼叫失敗，將剛剛加入的使用者訊息從歷史中移除
                chatHistory.pop(); 
                appendMessage(`抱歉，連線時發生錯誤：${error.message || '無法取得 AI 回覆。'}`, 'is-admin');
            } finally {
                sendBtn.disabled = false;
                messageInput.focus(); // 讓使用者可以繼續輸入
            }
        }

        // --- 事件監聽 ---
        if (chatFab && chatWidget && chatCloseBtn) {
            // 控制聊天視窗的開關
            chatFab.addEventListener('click', () => chatWidget.classList.toggle('is-open'));
            chatCloseBtn.addEventListener('click', () => chatWidget.classList.remove('is-open'));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && chatWidget.classList.contains('is-open')) {
                    chatWidget.classList.remove('is-open');
                }
            });

            // 處理訊息發送
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // 讓輸入框自動增高
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = `${messageInput.scrollHeight}px`;
            });
            
            // 初始化聊天室
            initializeChat();
        }
      });
    </script>
</body>
</html>
