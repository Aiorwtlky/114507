{% extends 'base.html' %}
{% block title %}成員儀表板 · My Driving God{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/member_dashboard.css') }}" />
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="dashboard-column-left">
      <div class="d-card personal-info-card">
        <div class="d-card-header">
          <h3><i class="fas fa-user"></i> 成員資訊</h3>
        </div>
        <div class="d-card-body">
          <div class="profile-summary">
            <img src="{{ url_for('static', filename='images/user-placeholder.svg') }}" alt="成員頭像" class="profile-avatar" id="member-avatar" />
            <div class="profile-details">
              <h4 class="profile-name" id="member-name">載入中...</h4>
              <p class="profile-meta" id="member-group">--</p>
              <p class="profile-meta" id="member-role">--</p>
            </div>
          </div>
        </div>
      </div>

      <div class="d-card trends-card">
        <div class="d-card-header">
          <h3><i class="fa-solid fa-arrow-trend-up"></i> 過往趨勢</h3>
        </div>
        <div class="d-card-body">
          <div class="chart-area">
            <canvas id="trendsChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="dashboard-column-right">
      <div class="d-card past-trips-card">
        <div class="d-card-header">
          <h3><i class="fa-solid fa-route"></i> 過往行程</h3>
          <a href="#" class="btn-view-more" id="view-all-trips-link">查看全部</a>
        </div>
        <div class="d-card-body">
          <ul id="past-trips-list">
            <li><p>載入中...</p></li>
          </ul>
        </div>
      </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/pages/member_dashboard.js') }}" defer></script>
{% endblock %}
