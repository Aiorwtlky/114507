{% extends 'base.html' %}
{% block title %}
  邀請新成員 · My Driving God
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/invite_member.css') }}" />
{% endblock %}

{% block content %}
  <div class="invite-container">
    <div class="d-card invite-card">
      <div class="d-card-body">
        <div class="invite-header">
          <h1>新增成員</h1>
          <p>北大物流 C組</p>
        </div>

        <div class="invite-main">
          <div class="qr-code-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://example.com/join/北大物流C組" alt="群組邀請 QR Code" />
          </div>
          <div class="link-section">
            <p class="invite-instruction">複製此網址以邀請新成員：</p>
            <div class="url-input-group">
              <input type="text" id="invite-link" value="https://mydrivinggod.com/join/a3x7b9p" readonly />
              <button id="copy-button" class="btn-copy"><i class="fa-solid fa-copy"></i> 複製</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="button-wrapper">
      <a href="{{ url_for('group_leader_view') }}" class="btn-solid-return">完成</a>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script>
    document.getElementById('copy-button').addEventListener('click', function () {
      const linkInput = document.getElementById('invite-link')
      linkInput.select()
      linkInput.setSelectionRange(0, 99999)
    
      try {
        navigator.clipboard.writeText(linkInput.value).then(() => {
          const originalText = this.innerHTML
          this.innerHTML = '<i class="fa-solid fa-check"></i> 已複製!'
          this.classList.add('copied')
    
          setTimeout(() => {
            this.innerHTML = originalText
            this.classList.remove('copied')
          }, 2000)
        })
      } catch (err) {
        console.error('無法複製連結: ', err)
      }
    })
  </script>
{% endblock %}
