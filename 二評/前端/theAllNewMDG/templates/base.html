<!DOCTYPE html>
<html class="{% block html_class %}

  {% endblock %}"
  lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>
      {% block title %}
        My Driving God 吾駕仙
      {% endblock %}
    </title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />

    <!-- 全站樣式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block extra_css %}

    {% endblock %}

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <!-- ===== Header ===== -->
    <header id="topbar">
      <nav class="wrap">
        <a href="{{ url_for('home') }}" class="brand" id="brand-hover">My&nbsp;Driving&nbsp;God&nbsp;吾駕仙</a>

        <!-- 新增介紹區塊 -->

        <ul class="nav-links">
          <li>
            <a href="{{ url_for('home') }}">首頁</a>
          </li>
          <li>
            <a href="{{ url_for('register') }}">註冊</a>
          </li>
          <li>
            <a href="{{ url_for('login') }}">登入</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- ✦ 浮動背景圖容器 -->
    <div id="bg-icons"></div>

    <!-- ===== Main ===== -->
    <main>
      {% block content %}

      {% endblock %}
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
      <p>© 2025 My Driving God 吾駕仙智慧交通系統 — All Rights Reserved.</p>
    </footer>

    <!-- 共用 JS -->
    <script src="{{ url_for('static', filename='js/scroll.js') }}" defer></script>
    <!-- 背景圖 JS -->
    <script src="{{ url_for('static', filename='js/bg-icons.js') }}" defer></script>

    {% block extra_js %}
      <script>
        const brand = document.getElementById('brand-hover')
        const infoBox = document.getElementById('brand-info')
        let hoverTimer
        
        brand.addEventListener('mouseenter', () => {
          clearTimeout(hoverTimer)
          infoBox.classList.add('show')
        })
        
        brand.addEventListener('mouseleave', () => {
          hoverTimer = setTimeout(() => {
            infoBox.classList.remove('show')
          }, 300)
        })
        
        infoBox.addEventListener('mouseenter', () => {
          clearTimeout(hoverTimer)
        })
        
        infoBox.addEventListener('mouseleave', () => {
          infoBox.classList.remove('show')
        })
        
      </script>
    {% endblock %}
  </body>
</html>
