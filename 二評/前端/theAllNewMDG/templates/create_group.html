{% extends 'base.html' %}
{% block title %}
  建立新群組 · My Driving God
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/create_group.css') }}" />
{% endblock %}

{% block content %}
<section class="create-group-section">
  <h2 class="mega-title gradient-text">建立新群組</h2>

  <div class="create-group-card">
    <div class="card-content">
      <h3 class="card-title">第一步：選擇成員</h3>
      
      <div class="search-bar-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="friend-search-input" placeholder="以姓名搜尋...">
      </div>
      
      <ul class="friend-list">
        <li class="friend-item">
          <img src="https://placehold.co/100x100/f0f0f0/333?text=吳" alt="User" class="profile-pic">
          <span class="friend-name">DK</span>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="friend-1" class="custom-checkbox">
            <label for="friend-1"></label>
          </div>
        </li>
        <li class="friend-item">
          <img src="https://placehold.co/100x100/e0e0e0/333?text=白" alt="User" class="profile-pic">
          <span class="friend-name">許凱</span>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="friend-2" class="custom-checkbox">
            <label for="friend-2"></label>
          </div>
        </li>
        <li class="friend-item">
          <img src="https://placehold.co/100x100/d0d0d0/333?text=QV" alt="User" class="profile-pic">
          <span class="friend-name">QV</span>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="friend-3" class="custom-checkbox">
            <label for="friend-3"></label>
          </div>
        </li>
        <li class="friend-item">
          <img src="https://placehold.co/100x100/c0c0c0/333?text=陳" alt="User" class="profile-pic">
          <span class="friend-name">宋陳澐</span>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="friend-4" class="custom-checkbox">
            <label for="friend-4"></label>
          </div>
        </li>
        <li class="friend-item">
          <img src="https://placehold.co/100x100/b0b0b0/333?text=爺" alt="User" class="profile-pic">
          <span class="friend-name">彥廷</span>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="friend-5" class="custom-checkbox">
            <label for="friend-5"></label>
          </div>
        </li>
        <li class="friend-item">
            <img src="https://placehold.co/100x100/a0a0a0/333?text=Am" alt="User" class="profile-pic">
            <span class="friend-name">花花</span>
            <div class="checkbox-wrapper">
              <input type="checkbox" id="friend-6" class="custom-checkbox">
              <label for="friend-6"></label>
            </div>
          </li>
          </ul>
      
      <div class="action-area">
        <a href="{{ url_for('dashboard') }}" class="custom-btn primary-btn">取消</a>
        <button class="custom-btn primary-btn">下一步</button>
      </div>
    </div>
  </div>
</section>
{% endblock %}
