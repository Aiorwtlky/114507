{% extends 'base2.html' %}
{% block title %}
  登入｜My Driving God 吾駕仙
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}" />
{% endblock %}

{% block content %}
  <section class="login-page">
    <form class="login-form" action="{{ url_for('login') }}" method="post">
      <h2>登入</h2>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" />

      <label for="password">密碼</label>
      <input type="password" id="password" name="password" />

      <div class="pro">
        <button type="submit" class="btn">登入</button>
        <button type="button" class="btn btn-secondary" id="registerButton">註冊</button>
      </div>
      <div class="forgot-password-link">
        <a href="{{ url_for('forgot_password') }}">忘記密碼？</a>
      </div>
    </form>
  </section>
{% endblock %}

{% block extra_js %}
  <script>
    const button = document.getElementById('registerButton')
    button.addEventListener('click', function () {
      window.location.href = '{{ url_for("register") }}'
    })
  </script>
{% endblock %}
