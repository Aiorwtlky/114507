{% extends "base.html" %}
{% block title %}登入｜My Driving God 吾駕仙{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">
{% endblock %}

{% block content %}
<section class="login-page">
  <form class="login-form" action="{{ url_for('login') }}" method="post">
    <h2>登入</h2>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">密碼</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn">登入</button>
  </form>
</section>
{% endblock %}

{% block extra_js %}
  <script src="{{ url_for('static', filename='js/pages/login.js') }}" defer></script>
{% endblock %}
