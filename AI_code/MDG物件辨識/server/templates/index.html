<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <title>內輪差警示事件列表</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        img { max-width: 200px; height: auto; }
    </style>
</head>
<body>
    <h1>內輪差警示事件列表</h1>
    <table id="eventsTable">
        <thead>
            <tr>
                <th>事件ID</th>
                <th>裝置序號</th>
                <th>事件時間</th>
                <th>鏡頭位置</th>
                <th>截圖</th>
                <th>影片</th>
                <th>警示等級</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function fetchEvents() {
            const response = await fetch('/api/events');
            const events = await response.json();
            const tbody = document.querySelector('#eventsTable tbody');
            tbody.innerHTML = '';
            events.forEach(e => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${e.event_id}</td>
                    <td>${e.device_serial}</td>
                    <td>${new Date(e.event_time).toLocaleString()}</td>
                    <td>${e.camera_position}</td>
                    <td>${e.image_path ? `<img src="${e.image_path}" alt="截圖">` : ''}</td>
                    <td>${e.video_path ? `<a href="${e.video_path}" target="_blank">觀看影片</a>` : ''}</td>
                    <td>${e.alert_level}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        window.onload = fetchEvents;
    </script>
</body>
</html>
