[device]
# 車機設備 ID（每台車機唯一）
device_id = MAC_DEV_001
device_name = 呱呱號列車

[api]
# 後端 API 設定
base_url = http://mdgitrc.ntub.edu.tw:8000
timeout = 30

[gcs]
# Google Cloud Storage 設定
bucket_name = mdg-itrc-videos
credentials_path = credentials/gcs-service-account.json
video_folder = videos
upload_chunk_size = 5242880

[recording]
# 錄影設定
record_inner_camera = false
record_outer_camera = true
fps = 30
resolution_width = 1920
resolution_height = 1080
video_format = mp4
codec = h264

[database]
# 本地資料庫設定
db_file = car_recorder.db

[sync]
# 同步設定
auto_sync = true
sync_on_wifi_only = false
retry_attempts = 3
retry_delay = 5